name: Daily Debrief → Discord

on:
  push:
    branches: [main]
    paths:
      - 'daily-debrief-latest.md'

jobs:
  send-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Debrief to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, time

          content = open('daily-debrief-latest.md', encoding='utf-8').read()
          webhook = os.environ['DISCORD_WEBHOOK']

          # Split into chunks of 1900 chars (Discord limit: 2000)
          chunks = []
          while len(content) > 1900:
              split_at = content.rfind('\n', 0, 1900)
              if split_at == -1:
                  split_at = 1900
              chunks.append(content[:split_at])
              content = content[split_at:].lstrip('\n')
          if content.strip():
              chunks.append(content)

          for i, chunk in enumerate(chunks):
              data = json.dumps({'content': chunk}).encode('utf-8')
              req = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={'Content-Type': 'application/json'}
              )
              urllib.request.urlopen(req)
              if i < len(chunks) - 1:
                  time.sleep(1)  # Rate limit protection

          print(f"Sent {len(chunks)} message(s) to Discord.")
          EOF
